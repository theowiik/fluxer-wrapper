# docker compose up -d
#
#   init     – first run: installs Fluxer with the official installer (proxy mode,
#              edge on 127.0.0.1:8080). Later runs: makes sure it's up.
#   crowdsec – reads Caddy's access log, decides who to ban.
#   caddy    – TLS, access log, allowlists, and enforces CrowdSec bans.

x-fluxer-dir: &fluxer-dir ${FLUXER_DIR:-/opt/fluxer}

services:
  init:
    build: ./init
    working_dir: *fluxer-dir
    environment:
      FLUXER_DOMAIN: ${FLUXER_DOMAIN:?set FLUXER_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      FLUXER_DIR: *fluxer-dir
    volumes:
      # Root-equivalent. Only used to run Fluxer's installer, then the container exits.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out, so Fluxer's bind mounts resolve on the host.
      - ${FLUXER_DIR:-/opt/fluxer}:${FLUXER_DIR:-/opt/fluxer}
    restart: "no"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      COLLECTIONS: crowdsecurity/caddy crowdsecurity/base-http-scenarios crowdsecurity/http-cve
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY in .env}
    # Local API for Caddy's bouncer. Loopback only; 8080 on the host is Fluxer.
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./logs/caddy:/var/log/caddy:ro
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec

  caddy:
    build: ./caddy
    restart: unless-stopped
    # Host networking: sees real client IPs (IPv4 and IPv6) and reaches Fluxer's
    # edge and CrowdSec on loopback. Listens on 80/443 (direct) or BEHIND_PORT (behind).
    network_mode: host
    environment:
      PROXY_MODE: ${PROXY_MODE:-direct}
      FLUXER_DOMAIN: ${FLUXER_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY}
      SITE_ALLOW_CIDRS: ${SITE_ALLOW_CIDRS:-private_ranges}
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS:-private_ranges}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      BEHIND_PORT: ${BEHIND_PORT:-80}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./logs/caddy:/var/log/caddy
      - ./logs/stats:/srv/stats/_stats:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      init:
        condition: service_completed_successfully
      crowdsec:
        condition: service_started

  # Traffic dashboard at /_stats/ (admin allowlist only), rebuilt every minute
  # from Caddy's access log. Uses client_ip so behind mode shows real visitors.
  goaccess:
    image: allinurl/goaccess:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          [ -s /logs/access.log ] && goaccess /logs/access.log -o /stats/index.html.tmp \
            --log-format='{ "ts": "%x.%^", "request": { "client_ip": "%h", "proto": "%H", "method": "%m", "host": "%v", "uri": "%U", "headers": { "User-Agent": ["%u"], "Referer": ["%R"] } }, "duration": "%T", "size": "%b", "status": "%s", "resp_headers": { "Content-Type": ["%M"] } }' \
            --date-format=%s --time-format=%s --html-report-title='Fluxer traffic' \
            --ignore-panel=KEYPHRASES >/dev/null 2>&1 \
          && mv /stats/index.html.tmp /stats/index.html
          sleep 60
        done
    volumes:
      - ./logs/caddy:/logs:ro
      - ./logs/stats:/stats

volumes:
  caddy-data:
  caddy-config:
  crowdsec-data:
  crowdsec-config:
